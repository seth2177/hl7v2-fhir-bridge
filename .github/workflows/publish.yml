name: Publish to PyPI

# Trusted Publishing: PyPI trusts this workflow's OIDC token. No API tokens or secrets are stored anywhere.
# One-time setup on PyPI: pending publisher for this repo, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Tag must equal package version
        run: |
          version=$(python -c "import glob, re; print(re.match(r'dist/[^-]+-([^-]+)-', glob.glob('dist/*.whl')[0]).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
